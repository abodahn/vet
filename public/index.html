<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Premium Pet Clinic</title>
<style>
:root{--bg:#08111f;--panel:#0e1b31;--card:#10213d;--line:rgba(255,255,255,.1);--text:rgba(255,255,255,.92);--muted:rgba(255,255,255,.66);--primary:#60a5fa;--good:#22c55e;--warn:#f59e0b;--bad:#ef4444;--radius:18px;--shadow:0 18px 55px rgba(0,0,0,.32);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(900px 560px at 15% 5%,#1a3a72 0%,var(--bg) 55%);color:var(--text)} button,input,select,textarea{font:inherit}
.layout{min-height:100vh;display:grid;grid-template-columns:280px 1fr}.side{padding:18px;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01))}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}.logo{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,var(--primary),#a78bfa);box-shadow:var(--shadow)}
h1,h2,h3{margin:0}.brand h1{font-size:16px}.sub,.muted{color:var(--muted);font-size:12px}.nav{display:flex;flex-direction:column;gap:8px}
.nav button{width:100%;text-align:left;padding:11px 12px;border:1px solid transparent;border-radius:14px;background:transparent;color:var(--muted);cursor:pointer}.nav button:hover,.nav button.active{border-color:rgba(96,165,250,.3);background:rgba(96,165,250,.13);color:var(--text)}
.main{padding:24px;overflow:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.grid{display:grid;gap:14px}.grid.three{grid-template-columns:repeat(3,1fr)}.grid.two{grid-template-columns:repeat(2,1fr)}.grid.four{grid-template-columns:repeat(4,1fr)}
.kpi{font-size:28px;font-weight:800;margin-top:6px}.kpi small{font-size:12px;color:var(--muted);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);cursor:pointer;text-decoration:none}.btn.primary{background:rgba(96,165,250,.17);border-color:rgba(96,165,250,.3)}.btn.good{background:rgba(34,197,94,.16);border-color:rgba(34,197,94,.32)}.btn.warn{background:rgba(245,158,11,.16);border-color:rgba(245,158,11,.32)}.btn.bad{background:rgba(239,68,68,.16);border-color:rgba(239,68,68,.32)}
input,select,textarea{width:100%;padding:10px 11px;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid var(--line);color:var(--text);outline:none}textarea{min-height:90px;resize:vertical}label{display:block;font-size:12px;color:var(--muted);margin:8px 0 5px}
table{width:100%;border-collapse:collapse}th,td{padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.08);font-size:12px;vertical-align:top;text-align:left}th{color:rgba(255,255,255,.78)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-flex;padding:3px 8px;border-radius:999px;border:1px solid var(--line);font-size:11px;color:var(--muted)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{max-width:420px;width:100%}.hidden{display:none!important}.msg{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);margin-bottom:12px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.full{grid-column:1/-1}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button.active{background:rgba(96,165,250,.17);border-color:rgba(96,165,250,.3)}.service-row{display:grid;grid-template-columns:2fr 90px 110px 190px 45px;gap:8px;align-items:end;margin-bottom:8px}.mini{font-size:11px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.58);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.on{display:flex}.box{width:min(980px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.boxhead{position:sticky;top:0;background:var(--panel);display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line)}.boxbody{padding:16px}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:3}.grid.three,.grid.two,.grid.four,.formgrid,.service-row{grid-template-columns:1fr}.nav{display:grid;grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="loginView" class="login"><div class="card"><div class="brand"><div class="logo"></div><div><h1>Premium Pet Clinic</h1><div class="sub">Netlify Database V2</div></div></div><div id="loginMsg" class="msg hidden"></div><label>Username</label><input id="username" value="Admin"/><label>Password</label><input id="password" type="password" value="1234"/><div style="height:12px"></div><button class="btn primary" style="width:100%" onclick="login()">Login</button></div></div>
<div id="appView" class="layout hidden"><aside class="side"><div class="brand"><div class="logo"></div><div><h1>Premium Pet Clinic</h1><div class="sub" id="whoami">Admin</div></div></div><div class="nav" id="nav"></div><div style="height:14px"></div><button class="btn bad" style="width:100%" onclick="logout()">Logout</button></aside><main class="main"><div class="top"><div><h2 id="pageTitle">Dashboard</h2><div class="sub" id="pageSub">Online clinic system powered by Netlify Database</div></div><div class="row-actions"><button class="btn" onclick="refresh()">Refresh</button><button class="btn primary" id="newBtn" onclick="openGenericForm()">New</button></div></div><div id="content"></div></main></div>
<div id="modal" class="modal"><div class="box"><div class="boxhead"><h3 id="modalTitle">Record</h3><button class="btn" onclick="closeModal()">Close</button></div><div class="boxbody"><div id="formMsg" class="msg hidden"></div><form id="recordForm" onsubmit="saveGeneric(event)"></form></div></div></div>
<script>
const state={token:localStorage.getItem("ppc_token")||"",user:null,tables:[],lookups:{},current:"dashboard",rows:[],editingId:null,options:null,bookingMode:"new"};
const api={async call(path,opt={}){const h={"content-type":"application/json",...(opt.headers||{})};if(state.token)h.authorization="Bearer "+state.token;const res=await fetch("/api"+path,{...opt,headers:h});const ct=res.headers.get("content-type")||"";const data=ct.includes("json")?await res.json():await res.text();if(!res.ok)throw new Error(data.error||data||"Request failed");return data;}};
function E(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function msg(id,t){const el=document.getElementById(id);el.textContent=t||"";el.classList.toggle("hidden",!t)}
async function login(){try{msg("loginMsg","");const d=await api.call("/login",{method:"POST",body:JSON.stringify({username:username.value,password:password.value})});state.token=d.token;localStorage.setItem("ppc_token",d.token);await start()}catch(e){msg("loginMsg",e.message)}}
function logout(){localStorage.removeItem("ppc_token");location.reload()}
async function start(){document.getElementById("loginView").classList.add("hidden");document.getElementById("appView").classList.remove("hidden");const me=await api.call("/me").catch(()=>null);if(!me)return logout();state.user=me.user;whoami.textContent=`${state.user.username} • ${state.user.role}`;state.tables=(await api.call("/tables")).tables;state.lookups=await api.call("/lookups");renderNav();await openPage("dashboard")}
function renderNav(){const items=[{key:"dashboard",label:"Dashboard"},{key:"booking_center",label:"Booking Center"},{key:"bookings",label:"Bookings"},...state.tables.filter(t=>!["bookings","audit_log"].includes(t.key)),state.tables.find(t=>t.key==="audit_log")].filter(Boolean);nav.innerHTML=items.map(t=>`<button class="${state.current===t.key?'active':''}" onclick="openPage('${t.key}')">${t.label}</button>`).join("")}
async function refresh(){await openPage(state.current)}
async function openPage(k){state.current=k;renderNav();if(k==="dashboard")return dashboard();if(k==="booking_center")return bookingCenter();return tablePage(k)}
function meta(k=state.current){return state.tables.find(t=>t.key===k)}
async function dashboard(){pageTitle.textContent="Dashboard";pageSub.textContent="Live KPIs";newBtn.style.display="none";const d=await api.call("/dashboard");content.innerHTML=`<div class="grid four"><div class="card"><div class="muted">Owners</div><div class="kpi">${d.counts.owners}</div></div><div class="card"><div class="muted">Pets</div><div class="kpi">${d.counts.pets}</div></div><div class="card"><div class="muted">Bookings</div><div class="kpi">${d.counts.bookings}<small> ${d.todayBookings} today</small></div></div><div class="card"><div class="muted">Due Amount</div><div class="kpi">${Number(d.due).toLocaleString()}</div></div></div><div class="card"><h3>Recent Bookings</h3>${bookingTable(d.recentBookings||[])}</div>`}
async function tablePage(k){const m=meta(k);pageTitle.textContent=m.label;pageSub.textContent=`Database collection: ${k}`;newBtn.style.display=k==="audit_log"?"none":"";const d=await api.call(k==="bookings"?"/booking/list":`/records/${k}`);state.rows=d.rows||[];content.innerHTML=`<div class="card"><div class="row-actions" style="justify-content:space-between"><input id="searchBox" placeholder="Search..." oninput="filterTable()" style="max-width:360px"><a class="btn" href="/api/export/${k}" target="_blank">Export CSV</a></div></div><div class="card" id="tableWrap">${k==="bookings"?bookingTable(state.rows):genericTable(state.rows,["id",...m.columns.slice(0,8)],k!=="audit_log")}</div>`}
function filterTable(){const q=searchBox.value.toLowerCase();const rows=state.rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));tableWrap.innerHTML=state.current==="bookings"?bookingTable(rows):genericTable(rows,["id",...meta().columns.slice(0,8)],state.current!=="audit_log")}
function genericTable(rows,heads,actions=true){if(!rows.length)return`<div class="muted">No data yet.</div>`;return`<table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join("")}${actions?`<th>Actions</th>`:""}</tr></thead><tbody>${rows.map(r=>`<tr>${heads.map(h=>`<td>${E(String(r[h]??"").slice(0,120))}</td>`).join("")}${actions?`<td><div class="row-actions"><button class="btn" onclick="openGenericForm('${r.id}')">Edit</button><button class="btn bad" onclick="deleteRecord('${r.id}')">Delete</button></div></td>`:""}</tr>`).join("")}</tbody></table>`}
function bookingTable(rows){if(!rows.length)return`<div class="muted">No bookings yet.</div>`;return`<table><thead><tr><th>Date</th><th>Owner</th><th>Pet</th><th>Service</th><th>Status</th><th>Payment</th><th>Due</th><th>Vet</th></tr></thead><tbody>${rows.map(b=>`<tr><td>${E(b.appointment_start)}</td><td>${E(b.owner_name||b.owner_id)}</td><td>${E(b.pet_name||b.pet_id)}</td><td>${E(b.service_name)}</td><td><span class="pill">${E(b.status)}</span></td><td>${E(b.payment_status)} / ${E(b.payment_channel)}</td><td>${E(b.due_amount)}</td><td>${E(b.vet_name)}</td></tr>`).join("")}</tbody></table>`}
async function bookingCenter(){pageTitle.textContent="Booking Center";pageSub.textContent="New customer / old customer booking workflow";newBtn.style.display="none";state.options=await api.call("/booking/options");content.innerHTML=`<div class="tabs"><button class="btn ${state.bookingMode==="new"?"active":""}" onclick="setMode('new')">New Customer</button><button class="btn ${state.bookingMode==="old"?"active":""}" onclick="setMode('old')">Old Customer</button><button class="btn" onclick="openPage('bookings')">Booking List</button></div><div id="bookingFormWrap"></div>`;renderBookingForm()}
function setMode(m){state.bookingMode=m;bookingCenter()}
function opt(list,val,label){return list.map(x=>`<option value="${E(x[val]??x)}">${E(x[label]??x.name??x)}</option>`).join("")}
function renderBookingForm(){const o=state.options;bookingFormWrap.innerHTML=`<form id="bookingForm" onsubmit="saveBooking(event)"><div class="grid two"><div class="card"><h3>${state.bookingMode==="new"?"Step 1: Owner":"Step 1: Search / Select Owner"}</h3>${state.bookingMode==="old"?`<label>Search old customer</label><input id="oldSearch" placeholder="Phone / owner / pet name" oninput="searchOld()"><div id="oldResults" class="mini"></div><label>Owner</label><select name="owner_id" id="ownerSelect" onchange="ownerChanged()"><option value="">Select owner...</option>${opt(o.owners,"id","owner_name")}</select><label>Pet</label><select name="pet_id" id="petSelect"><option value="">Select pet...</option></select>`:`<div class="formgrid"><div><label>Owner Name *</label><input name="owner_name" required></div><div><label>Phone *</label><input name="phone" required></div><div><label>Email</label><input name="email"></div><div><label>Preferred Contact</label><select name="preferred_contact"><option>WhatsApp</option><option>Phone</option><option>Email</option></select></div><div class="full"><label>Address</label><textarea name="address"></textarea></div></div>`}</div><div class="card"><h3>Step 2: Pet</h3>${state.bookingMode==="old"?`<div class="muted">Select an existing pet above, or fill these fields to create a new pet under the selected owner.</div>`:""}<div class="formgrid"><div><label>Pet Name ${state.bookingMode==="new"?"*":""}</label><input name="pet_name" ${state.bookingMode==="new"?"required":""}></div><div><label>Species</label><input name="species"></div><div><label>Breed</label><input name="breed"></div><div><label>Sex</label><select name="sex"><option></option><option>Male</option><option>Female</option></select></div><div><label>Age Years</label><input name="age_years"></div><div><label>Weight KG</label><input name="weight_kg"></div><div class="full"><label>Allergies / Chronic Conditions</label><textarea name="allergies" placeholder="Allergies"></textarea><textarea name="chronic_conditions" placeholder="Chronic conditions" style="margin-top:8px"></textarea></div></div></div></div><div class="card"><h3>Step 3: Booking Details</h3><div class="formgrid"><div><label>Appointment Start *</label><input name="appointment_start" type="datetime-local" required></div><div><label>Duration</label><input name="duration_min" value="30"></div><div><label>Type</label><select name="appointment_type">${state.lookups.appointmentTypes.map(x=>`<option>${x}</option>`).join("")}</select></div><div><label>Priority</label><select name="priority">${state.lookups.priorities.map(x=>`<option>${x}</option>`).join("")}</select></div><div><label>Status</label><select name="status">${state.lookups.statuses.map(x=>`<option>${x}</option>`).join("")}</select></div><div><label>Channel</label><select name="channel">${state.lookups.channels.map(x=>`<option>${x}</option>`).join("")}</select></div><div><label>Vet</label><select name="vet_name"><option></option>${opt(o.vets,"name","name")}</select></div><div><label>Room</label><select name="room"><option></option>${opt(o.rooms,"name","name")}</select></div><div class="full"><label>Diagnosis / Reason</label><textarea name="reason"></textarea></div><div class="full"><label>Symptoms</label><textarea name="symptoms"></textarea></div></div></div><div class="card"><h3>Step 4: Services & Reminder</h3><div id="servicesBox"></div><button type="button" class="btn good" onclick="addService()">+ Add Service</button><div class="grid four" style="margin-top:12px"><div><label>Discount Type</label><select name="discount_type" onchange="calcTotal()"><option value="value">Value</option><option value="percent">Percent</option></select></div><div><label>Discount Value</label><input name="discount_value" value="0" oninput="calcTotal()"></div><div><label>Paid Amount</label><input name="paid_amount" value="0" oninput="calcTotal()"></div><div><label>Payment Channel</label><select name="payment_channel">${state.lookups.paymentChannels.map(x=>`<option>${x}</option>`).join("")}</select></div></div><div class="grid three" style="margin-top:12px"><div class="card"><div class="muted">Subtotal</div><div class="kpi" id="subtotal">0</div></div><div class="card"><div class="muted">Net</div><div class="kpi" id="netTotal">0</div></div><div class="card"><div class="muted">Due</div><div class="kpi" id="dueTotal">0</div></div></div><div class="formgrid"><div><label>Reminder Channel</label><select name="reminder_channel">${state.lookups.reminderChannels.map(x=>`<option>${x}</option>`).join("")}</select></div><div><label>Follow-up Datetime</label><input name="followup_datetime" type="datetime-local"></div><div class="full"><label>Treatment Plan</label><textarea name="treatment_plan"></textarea></div><div class="full"><label>Prescription</label><textarea name="prescription"></textarea></div><div><label>Lab Tests</label><input name="lab_tests"></div><div><label>Vaccines Given</label><input name="vaccines_given"></div><div class="full"><label>Notes</label><textarea name="notes"></textarea></div></div><button class="btn primary" type="submit">Create Booking + Reminder + Invoice No.</button><div id="bookingMsg" class="msg hidden" style="margin-top:12px"></div></div></form>`;addService();ownerChanged();calcTotal()}
function addService(){const row=document.createElement("div");row.className="service-row";row.innerHTML=`<div><label>Service</label><select class="svcName" onchange="serviceChanged(this)"><option value="">Select...</option>${state.options.services.map(s=>`<option data-fee="${E(s.fee)}" value="${E(s.name)}">${E(s.name)} - ${E(s.fee)}</option>`).join("")}</select></div><div><label>Qty</label><input class="svcQty" value="1" oninput="calcTotal()"></div><div><label>Fee</label><input class="svcFee" value="0" oninput="calcTotal()"></div><div><label>Service Reminder</label><input class="svcReminder" type="datetime-local"></div><button type="button" class="btn bad" onclick="this.parentElement.remove();calcTotal()">×</button>`;servicesBox.appendChild(row)}
function serviceChanged(sel){const fee=sel.selectedOptions[0]?.dataset?.fee||0;sel.closest(".service-row").querySelector(".svcFee").value=fee;calcTotal()}
function servicesData(){return[...document.querySelectorAll(".service-row")].map(r=>({name:r.querySelector(".svcName").value,qty:r.querySelector(".svcQty").value,fee:r.querySelector(".svcFee").value,reminder_at:r.querySelector(".svcReminder").value.replace("T"," ")})).filter(x=>x.name)}
function calcTotal(){const f=bookingForm;if(!f)return;const subtotal=servicesData().reduce((s,x)=>s+Number(x.fee||0)*Math.max(1,Number(x.qty||1)),0);const discType=f.discount_type?.value||"value";let disc=Number(f.discount_value?.value||0);if(discType==="percent")disc=subtotal*Math.min(100,Math.max(0,disc))/100;disc=Math.min(subtotal,Math.max(0,disc));const net=subtotal-disc;const paid=Number(f.paid_amount?.value||0);const due=Math.max(0,net-paid);document.getElementById("subtotal").textContent=subtotal.toFixed(2);document.getElementById("netTotal").textContent=net.toFixed(2);document.getElementById("dueTotal").textContent=due.toFixed(2)}
function ownerChanged(){if(!state.options)return;const ownerId=document.getElementById("ownerSelect")?.value||"";const ps=state.options.pets.filter(p=>p.owner_id===ownerId);const sel=document.getElementById("petSelect");if(sel)sel.innerHTML=`<option value="">Create/select pet...</option>${ps.map(p=>`<option value="${E(p.id)}">${E(p.pet_name)} (${E(p.species)})</option>`).join("")}`}
async function searchOld(){const q=oldSearch.value;if(q.length<2){oldResults.innerHTML="";return}const d=await api.call("/booking/search?q="+encodeURIComponent(q));oldResults.innerHTML=`<div style="margin-top:8px">${d.owners.map(o=>`<button type="button" class="btn" onclick="pickOwner('${o.id}')">${E(o.owner_name)} - ${E(o.phone)}</button>`).join(" ")}</div>`}
function pickOwner(id){ownerSelect.value=id;ownerChanged()}
async function saveBooking(e){e.preventDefault();try{msg("bookingMsg","");const fd=new FormData(e.target);const obj=Object.fromEntries(fd.entries());for(const k of ["appointment_start","followup_datetime"])if(obj[k])obj[k]=obj[k].replace("T"," ");obj.services=servicesData();if(state.bookingMode==="old"&&!obj.owner_id&&!obj.owner_name)throw new Error("Please select an old owner or fill new owner data.");if(!obj.pet_id&&!obj.pet_name)throw new Error("Please select a pet or write new pet name.");const out=await api.call("/booking/create-complete",{method:"POST",body:JSON.stringify(obj)});msg("bookingMsg",`Booking created successfully. Invoice: ${out.booking.invoice_no}`);e.target.reset();servicesBox.innerHTML="";addService();calcTotal()}catch(err){msg("bookingMsg",err.message)}}
function openGenericForm(id=null){state.editingId=id;const m=meta();if(!m)return;const existing=id?state.rows.find(r=>r.id===id)||{}:{};modalTitle.textContent=`${id?"Edit":"New"} ${m.label}`;recordForm.innerHTML=`<div class="formgrid">${m.columns.map(c=>field(c,existing[c]||"",m.required.includes(c))).join("")}</div><div style="height:14px"></div><button class="btn primary">Save</button>`;modal.classList.add("on")}
function field(c,v,req){const full=/notes|message|treatment|prescription|symptoms|template|details/i.test(c);return `<div class="${full?'full':''}"><label>${c}${req?' *':''}</label>${full?`<textarea name="${c}" ${req?'required':''}>${E(v)}</textarea>`:`<input name="${c}" value="${E(v)}" ${req?'required':''}>`}</div>`}
function closeModal(){modal.classList.remove("on")}
async function saveGeneric(e){e.preventDefault();const obj=Object.fromEntries(new FormData(e.target).entries());const url=state.editingId?`/records/${state.current}/${state.editingId}`:`/records/${state.current}`;await api.call(url,{method:state.editingId?"PUT":"POST",body:JSON.stringify(obj)});closeModal();await tablePage(state.current)}
async function deleteRecord(id){if(!confirm("Delete record?"))return;await api.call(`/records/${state.current}/${id}`,{method:"DELETE"});await tablePage(state.current)}
if(state.token)start().catch(()=>logout());
</script>
</body>
</html>
