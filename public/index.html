
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Premium Pet Clinic</title>
<style>
:root{--bg:#08111f;--panel:#0e1b31;--line:rgba(255,255,255,.1);--text:rgba(255,255,255,.92);--muted:rgba(255,255,255,.66);--primary:#60a5fa;--bad:#ef4444;--shadow:0 18px 55px rgba(0,0,0,.32);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 560px at 15% 5%,#1a3a72 0%,var(--bg) 55%);color:var(--text)}button,input,textarea{font:inherit}.layout{min-height:100vh;display:grid;grid-template-columns:280px 1fr}.side{padding:18px;border-right:1px solid var(--line);background:rgba(255,255,255,.04)}.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}.logo{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,var(--primary),#a78bfa);box-shadow:var(--shadow)}h1,h2,h3{margin:0}.brand h1{font-size:16px}.sub,.muted{color:var(--muted);font-size:12px}.nav{display:flex;flex-direction:column;gap:8px}.nav button{width:100%;text-align:left;padding:11px 12px;border:1px solid transparent;border-radius:14px;background:transparent;color:var(--muted);cursor:pointer}.nav button:hover,.nav button.active{border-color:rgba(96,165,250,.3);background:rgba(96,165,250,.13);color:var(--text)}.main{padding:24px;overflow:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}.grid{display:grid;gap:14px}.grid.three{grid-template-columns:repeat(3,1fr)}.kpi{font-size:28px;font-weight:800;margin-top:6px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);cursor:pointer;text-decoration:none}.btn.primary{background:rgba(96,165,250,.17);border-color:rgba(96,165,250,.3)}.btn.bad{background:rgba(239,68,68,.16);border-color:rgba(239,68,68,.32)}input,textarea{width:100%;padding:10px 11px;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid var(--line);color:var(--text);outline:none}textarea{min-height:90px}label{display:block;font-size:12px;color:var(--muted);margin:8px 0 5px}table{width:100%;border-collapse:collapse}th,td{padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.08);font-size:12px;vertical-align:top;text-align:left}th{color:rgba(255,255,255,.78)}.row-actions{display:flex;gap:8px;flex-wrap:wrap}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{max-width:420px;width:100%}.hidden{display:none!important}.modal{position:fixed;inset:0;background:rgba(0,0,0,.58);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.on{display:flex}.box{width:min(980px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.boxhead{position:sticky;top:0;background:var(--panel);display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line)}.boxbody{padding:16px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.full{grid-column:1/-1}.msg{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);margin-bottom:12px;color:var(--muted)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.grid.three,.formgrid{grid-template-columns:1fr}.nav{display:grid;grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div id="loginView" class="login"><div class="card"><div class="brand"><div class="logo"></div><div><h1>Premium Pet Clinic</h1><div class="sub">Netlify Database Version</div></div></div><div id="loginMsg" class="msg hidden"></div><label>Username</label><input id="username" value="Admin"><label>Password</label><input id="password" type="password" value="1234"><div style="height:12px"></div><button class="btn primary" style="width:100%" onclick="login()">Login</button><div class="sub" style="margin-top:12px">Set production credentials in Netlify environment variables.</div></div></div>
<div id="appView" class="layout hidden"><aside class="side"><div class="brand"><div class="logo"></div><div><h1>Premium Pet Clinic</h1><div class="sub" id="whoami">Admin</div></div></div><div class="nav" id="nav"></div><div style="height:14px"></div><button class="btn bad" style="width:100%" onclick="logout()">Logout</button></aside><main class="main"><div class="top"><div><h2 id="pageTitle">Dashboard</h2><div class="sub" id="pageSub">Online system powered by Netlify Database/Postgres</div></div><div class="row-actions"><button class="btn" onclick="loadDashboard()">Refresh</button><button class="btn primary" id="newBtn" onclick="openForm()">New</button></div></div><div id="content"></div></main></div>
<div id="modal" class="modal"><div class="box"><div class="boxhead"><h3 id="modalTitle">Record</h3><button class="btn" onclick="closeModal()">Close</button></div><div class="boxbody"><div id="formMsg" class="msg hidden"></div><form id="recordForm" onsubmit="saveForm(event)"></form></div></div></div>
<script>
const state={token:localStorage.getItem('ppc_token')||'',user:null,tables:[],current:'dashboard',currentRows:[],editingId:null};
const API={async call(path,options={}){const headers={'content-type':'application/json',...(options.headers||{})};if(state.token)headers.authorization='Bearer '+state.token;const res=await fetch('/api'+path,{...options,headers});const ct=res.headers.get('content-type')||'';const data=ct.includes('application/json')?await res.json():await res.text();if(!res.ok)throw new Error(data.error||data||'Request failed');return data;}};
function msg(id,text){const el=document.getElementById(id);el.textContent=text||'';el.classList.toggle('hidden',!text)}
async function login(){try{msg('loginMsg','');const data=await API.call('/login',{method:'POST',body:JSON.stringify({username:username.value,password:password.value})});state.token=data.token;state.user=data.user;localStorage.setItem('ppc_token',state.token);await startApp()}catch(e){msg('loginMsg',e.message)}}
function logout(){localStorage.removeItem('ppc_token');location.reload()}
async function startApp(){loginView.classList.add('hidden');appView.classList.remove('hidden');const me=await API.call('/me').catch(()=>null);if(!me)return logout();state.user=me.user;whoami.textContent=`${state.user.username} • ${state.user.role}`;const t=await API.call('/tables');state.tables=t.tables;renderNav();await loadDashboard()}
function renderNav(){const items=[{key:'dashboard',label:'Dashboard'},...state.tables.filter(t=>t.key!=='audit_log'),state.tables.find(t=>t.key==='audit_log')].filter(Boolean);nav.innerHTML=items.map(t=>`<button class="${state.current===t.key?'active':''}" onclick="openPage('${t.key}')">${t.label}</button>`).join('')}
async function openPage(key){state.current=key;renderNav();if(key==='dashboard')return loadDashboard();await loadTable(key)}
function meta(key=state.current){return state.tables.find(t=>t.key===key)}
async function loadDashboard(){state.current='dashboard';renderNav();pageTitle.textContent='Dashboard';pageSub.textContent='Live KPIs from Netlify Database';newBtn.style.display='none';const d=await API.call('/dashboard');content.innerHTML=`<div class="grid three"><div class="card"><div class="muted">Owners</div><div class="kpi">${d.counts.owners}</div></div><div class="card"><div class="muted">Pets</div><div class="kpi">${d.counts.pets}</div></div><div class="card"><div class="muted">Bookings</div><div class="kpi">${d.counts.bookings}</div><div class="sub">${d.todayBookings} today</div></div><div class="card"><div class="muted">Reminders</div><div class="kpi">${d.counts.reminders}</div></div><div class="card"><div class="muted">Services</div><div class="kpi">${d.counts.services}</div></div><div class="card"><div class="muted">Revenue Signal</div><div class="kpi">${Number(d.revenue).toLocaleString()}</div></div></div><div class="card"><h3>Recent Bookings</h3>${tableHtml(d.recentBookings||[],['appointment_start','owner_id','pet_id','service_name','status','payment_status'],false)}</div>`}
async function loadTable(key){const m=meta(key);pageTitle.textContent=m.label;pageSub.textContent=`${m.columns.length} fields • Netlify DB collection: ${key}`;newBtn.style.display=key==='audit_log'?'none':'';const data=await API.call(`/records/${key}`);state.currentRows=data.rows||[];content.innerHTML=`<div class="card"><div class="row-actions" style="justify-content:space-between"><input id="searchBox" placeholder="Search ${m.label}..." oninput="filterTable()" style="max-width:360px"><a class="btn" href="/api/export/${key}" target="_blank">Export CSV</a></div></div><div class="card" id="tableWrap">${tableHtml(state.currentRows,['id',...m.columns.slice(0,8)],key!=='audit_log')}</div>`}
function filterTable(){const q=searchBox.value.toLowerCase();const rows=state.currentRows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));const m=meta();tableWrap.innerHTML=tableHtml(rows,['id',...m.columns.slice(0,8)],state.current!=='audit_log')}
function tableHtml(rows,headers,actions=true){if(!rows||!rows.length)return `<div class="muted">No data yet.</div>`;return `<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}${actions?`<th>Actions</th>`:''}</tr></thead><tbody>${rows.map(r=>`<tr>${headers.map(h=>`<td>${escapeHtml(String(r[h]??'').slice(0,120))}</td>`).join('')}${actions?`<td><div class="row-actions"><button class="btn" onclick="openForm('${r.id}')">Edit</button><button class="btn bad" onclick="deleteRecord('${r.id}')">Delete</button></div></td>`:''}</tr>`).join('')}</tbody></table>`}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function openForm(id=null){state.editingId=id;const m=meta();const existing=id?await API.call(`/records/${state.current}/${id}`).then(x=>x.row):{};modalTitle.textContent=`${id?'Edit':'New'} ${m.label}`;msg('formMsg','');recordForm.innerHTML=`<div class="formgrid">${m.columns.map(col=>fieldHtml(col,existing[col]||'',m.required.includes(col))).join('')}</div><div style="height:14px"></div><button class="btn primary" type="submit">Save</button>`;modal.classList.add('on')}
function fieldHtml(col,value,required){const low=col.toLowerCase();const full=['notes','message','treatment','prescription','symptoms','template','details'].some(x=>low.includes(x));if(full)return `<div class="full"><label>${col}${required?' *':''}</label><textarea name="${col}" ${required?'required':''}>${escapeHtml(value)}</textarea></div>`;const type=(low.includes('datetime')||low.includes('appointment_start')||low.includes('scheduled_for'))?'datetime-local':'text';return `<div><label>${col}${required?' *':''}</label><input name="${col}" type="${type}" value="${escapeHtml(toLocalDateValue(value))}" ${required?'required':''}></div>`}
function toLocalDateValue(v){if(!v)return '';return String(v).replace(' ','T').slice(0,16)}function closeModal(){modal.classList.remove('on')}
async function saveForm(e){e.preventDefault();try{msg('formMsg','');const obj=Object.fromEntries(new FormData(e.target).entries());for(const k of Object.keys(obj)){if(obj[k]&&(k.includes('datetime')||k==='appointment_start'||k==='scheduled_for'))obj[k]=obj[k].replace('T',' ')}if(state.editingId)await API.call(`/records/${state.current}/${state.editingId}`,{method:'PUT',body:JSON.stringify(obj)});else await API.call(`/records/${state.current}`,{method:'POST',body:JSON.stringify(obj)});closeModal();await loadTable(state.current)}catch(e){msg('formMsg',e.message)}}
async function deleteRecord(id){if(!confirm('Delete this record?'))return;await API.call(`/records/${state.current}/${id}`,{method:'DELETE'});await loadTable(state.current)}
if(state.token)startApp().catch(()=>logout());
</script></body></html>
